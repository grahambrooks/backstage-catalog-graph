# Runner: prek. Fast checks on changed files at commit, the whole build at push.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^src/test/resources/fixtures/malformed\.yaml$
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gradle-build
        name: gradle build
        entry: ./gradlew build --console=plain
        language: system
        pass_filenames: false
        stages: [pre-push]
