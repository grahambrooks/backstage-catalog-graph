# Runner: prek. Fast checks on changed files at commit, the full build at push.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^editors/jetbrains/src/test/resources/fixtures/malformed\.yaml$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: jetbrains-build
        name: jetbrains build
        entry: bash -c 'cd editors/jetbrains && ./gradlew build --console=plain'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vscode-test
        name: vscode typecheck and test
        entry: bash -c 'cd editors/vscode && npm run typecheck && npm test'
        language: system
        pass_filenames: false
        stages: [pre-push]
