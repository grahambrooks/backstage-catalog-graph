# A catalog with enough entities to be worth navigating: one domain, four systems,
# sixteen components, eight APIs, four databases and four teams.
#
# This is the example for the viewport controls. Fit to Window should bring the whole graph
# into view; Ctrl/Cmd-scroll zooms about the cursor; plain scroll pans vertically and
# Shift-scroll horizontally. Clicking a node should dim everything outside its neighbourhood,
# which is the only practical way to read a graph this size.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: commerce
  title: Commerce
  description: The whole customer-facing estate
spec:
  owner: group:commerce-leadership
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: storefront
  title: Storefront
spec:
  owner: group:storefront-team
  domain: commerce
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: storefront-web
  title: Storefront Web
  tags:
    - typescript
spec:
  type: website
  lifecycle: production
  owner: group:storefront-team
  system: storefront
  providesApis:
    - storefront-web-api
  consumesApis:
    - platform-gateway-api
  dependsOn:
    - resource:default/storefront-db
---
