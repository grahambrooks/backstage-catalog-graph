# Publishing to the JetBrains Marketplace is irreversible -- a published version cannot be
# withdrawn, only superseded. It is therefore kept off the tag path and run by hand.
name: Publish to JetBrains Marketplace

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Marketplace channel
        required: true
        default: eap
        type: choice
        options: [eap, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -Pchannel=${{ inputs.channel }}
