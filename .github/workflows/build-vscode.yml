name: Build (VS Code)

on:
  push:
    branches: [main]
    paths: ['editors/vscode/**', 'conformance/**', 'examples/**', '.github/workflows/build-vscode.yml']
  pull_request:
    paths: ['editors/vscode/**', 'conformance/**', 'examples/**', '.github/workflows/build-vscode.yml']
  workflow_dispatch:

# Read-only: these jobs build and upload artifacts, nothing else.
permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: editors/vscode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the same conformance corpus the JetBrains job runs.
      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --out backstage-catalog-graph-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
