name: Build (JetBrains)

on:
  push:
    branches: [main]
    paths: ['editors/jetbrains/**', 'conformance/**', 'examples/**', '.github/workflows/build-jetbrains.yml']
  pull_request:
    paths: ['editors/jetbrains/**', 'conformance/**', 'examples/**', '.github/workflows/build-jetbrains.yml']
  workflow_dispatch:

# Read-only: these jobs build and upload artifacts, nothing else.
permissions:
  contents: read

concurrency:
  group: jetbrains-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: editors/jetbrains

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # `build` runs the unit tests and the shared conformance corpus.
      - name: Build and test
        run: ./gradlew build verifyPluginProjectConfiguration verifyPluginStructure

      - name: Verify against recommended IDEs
        run: ./gradlew verifyPlugin

      - name: Package
        run: ./gradlew packageTestKit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-plugin
          path: editors/jetbrains/build/distributions/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: jetbrains-reports
          path: editors/jetbrains/build/reports/
