name: Release

on:
  push:
    tags: ['v*']

# contents: write to create the release; id-token and attestations to sign build provenance.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Both editors are versioned together, so a tag that matches one but not the other is a
      # mistake worth failing on before anything is published.
      - name: Check the tag matches both editors
        run: |
          tag="${GITHUB_REF_NAME#v}"
          jetbrains="$(grep -E '^pluginVersion' editors/jetbrains/gradle.properties | cut -d= -f2 | tr -d ' ')"
          vscode="$(node -p "require('./editors/vscode/package.json').version")"
          echo "tag=$tag jetbrains=$jetbrains vscode=$vscode"
          [ "$tag" = "$jetbrains" ] || { echo "::error::tag $tag != editors/jetbrains $jetbrains"; exit 1; }
          [ "$tag" = "$vscode" ]    || { echo "::error::tag $tag != editors/vscode $vscode"; exit 1; }

      - name: Build JetBrains plugin
        working-directory: editors/jetbrains
        run: ./gradlew build verifyPlugin buildPlugin

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package

      # The notes are this version's section of CHANGELOG.md. Generated notes are built from
      # merged pull requests, and this repository is trunk-based with none.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      # Exactly the two installable packages, named by version. The test kit stays out: it nests
      # the plugin ZIP inside another ZIP, and "Install Plugin from Disk" rejects it.
      - name: Collect packages and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp "editors/jetbrains/build/distributions/backstage-catalog-graph-$version.zip" dist/
          cp "editors/vscode/backstage-catalog-graph-$version.vsix" dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.vsix

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
