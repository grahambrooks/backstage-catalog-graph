name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: gradle/actions/setup-gradle@v6

      # Both editors are versioned together, so a tag that matches one but not the other is a
      # mistake worth failing on before anything is published.
      - name: Check the tag matches both editors
        run: |
          tag="${GITHUB_REF_NAME#v}"
          jetbrains="$(grep -E '^pluginVersion' editors/jetbrains/gradle.properties | cut -d= -f2 | tr -d ' ')"
          vscode="$(node -p "require('./editors/vscode/package.json').version")"
          echo "tag=$tag jetbrains=$jetbrains vscode=$vscode"
          [ "$tag" = "$jetbrains" ] || { echo "::error::tag $tag != editors/jetbrains $jetbrains"; exit 1; }
          [ "$tag" = "$vscode" ]    || { echo "::error::tag $tag != editors/vscode $vscode"; exit 1; }

      - name: Build JetBrains plugin
        working-directory: editors/jetbrains
        run: ./gradlew build verifyPlugin packageTestKit

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            editors/jetbrains/build/distributions/*.zip
            editors/vscode/*.vsix
          generate_release_notes: true
