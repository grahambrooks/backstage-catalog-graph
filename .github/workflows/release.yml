name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build verifyPlugin

      - name: Check the tag matches pluginVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep -E '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')"
          if [ "$tag" != "$declared" ]; then
            echo "Tag $tag does not match pluginVersion $declared in gradle.properties" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
